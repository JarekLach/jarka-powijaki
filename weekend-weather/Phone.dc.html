<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400&display=swap">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; font-family: "Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif; }
    a { color: #BF6134; text-decoration: none; }
    a:hover { color: #9A4826; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; overflow: hidden; background: #FAF5EC; color: #2E2A24; display: flex; flex-direction: column;">

  <!-- ===== HERO ===== -->
  <div style="position: relative; height: 250px; flex: none;">
    <sc-if value="{{ isSF }}" hint-placeholder-val="{{ true }}">

        <g fill="#A8451F">

          <rect x="102" y="150" width="17" height="8"></rect>
          <rect x="271" y="112" width="18" height="8"></rect>
          <rect x="272" y="150" width="17" height="8"></rect>

        <polygon points="105,64 114,64 109.5,52" fill="#C4562F"></polygon>
        <polygon points="275,64 284,64 279.5,52" fill="#C4562F"></polygon>

    <sc-if value="{{ isLDN }}" hint-placeholder-val="{{ false }}">

            <rect x="281" y="164" width="9" height="21" rx="4.5"></rect>
          </g>
        </g>
        <rect y="222" width="390" height="28" fill="#8B968F"></rect>
        <ellipse cx="132" cy="227" rx="88" ry="6" fill="#76827C" opacity="0.6"></ellipse>
        <g>
          <rect x="38" y="140" width="138" height="82" rx="11" fill="#BE3B34"></rect>
          <rect x="38" y="178" width="138" height="5" fill="#9C2B26"></rect>
          <g fill="#F6EEDF">
            <rect x="50" y="150" width="25" height="19" rx="3.5"></rect>

            <rect x="114" y="150" width="25" height="19" rx="3.5"></rect>
            <rect x="146" y="150" width="21" height="19" rx="3.5"></rect>
            <rect x="50" y="190" width="35" height="20" rx="3.5"></rect>
            <rect x="93" y="190" width="35" height="20" rx="3.5"></rect>
            <rect x="136" y="190" width="31" height="20" rx="3.5"></rect>
          </g>
          <circle cx="68" cy="222" r="12" fill="#3B3730"></circle>
          <circle cx="68" cy="222" r="5" fill="#8B968F"></circle>
          <circle cx="150" cy="222" r="12" fill="#3B3730"></circle>
          <circle cx="150" cy="222" r="5" fill="#8B968F"></circle>
        </g>
        <g transform="translate(46,70)">
          <path d="M-28 0 A28 26 0 0 1 28 0 Z" fill="#E8B84B"></path>
          <path d="M-28 0 A28 26 0 0 1 28 0" fill="none" stroke="#C99A2E" stroke-width="1.8"></path>
          <path d="M0 0 V26 a7 7 0 0 0 14 0" fill="none" stroke="#8E7A5F" stroke-width="3" stroke-linecap="round"></path>
        </g>
        <g stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" opacity="0.6">
          <path d="M110 22 l-7 17M150 46 l-7 17M198 16 l-7 17M234 66 l-7 17M322 28 l-7 17M356 72 l-7 17M74 88 l-7 17M340 124 l-7 17M216 110 l-7 17M22 110 l-7 17M186 136 l-7 17M368 172 l-7 17"></path>
        </g>
      </svg>
    </sc-if>

    <sc-if value="{{ isTKY }}" hint-placeholder-val="{{ false }}">
      <svg viewBox="0 0 390 250" width="100%" height="100%" preserveAspectRatio="xMidYMid slice" style="display: block;">
        <defs>
          <linearGradient id="pTkySky" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#FDE0B4"></stop>
            <stop offset="0.55" stop-color="#F7B893"></stop>
            <stop offset="1" stop-color="#EE9184"></stop>
          </linearGradient>
        </defs>
        <rect width="390" height="250" fill="url(#pTkySky)"></rect>
        <circle cx="98" cy="82" r="48" fill="#FFF0C4" opacity="0.55"></circle>
        <circle cx="98" cy="82" r="31" fill="#FFE79C"></circle>
        <g fill="#FFFFFF" opacity="0.5">
          <rect x="150" y="40" width="80" height="21" rx="10.5"></rect>
          <rect x="175" y="28" width="50" height="18" rx="9"></rect>
          <rect x="290" y="54" width="70" height="18" rx="9"></rect>
        </g>
        <g fill="#C9636A">
          <rect x="12" y="164" width="39" height="62"></rect>
          <rect x="58" y="143" width="30" height="83"></rect>
          <rect x="94" y="179" width="46" height="47"></rect>
          <rect x="147" y="155" width="32" height="71"></rect>
          <rect x="186" y="186" width="39" height="40"></rect>
          <rect x="328" y="160" width="34" height="66"></rect>
          <rect x="367" y="181" width="23" height="45"></rect>
        </g>
        <g fill="#DE8A7E" opacity="0.75">
          <rect x="19" y="176" width="8" height="9"></rect>
          <rect x="35" y="176" width="8" height="9"></rect>
          <rect x="19" y="194" width="8" height="9"></rect>
          <rect x="35" y="194" width="8" height="9"></rect>
          <rect x="64" y="157" width="7" height="9"></rect>
          <rect x="76" y="157" width="7" height="9"></rect>
          <rect x="64" y="178" width="7" height="9"></rect>
          <rect x="154" y="169" width="8" height="9"></rect>
          <rect x="166" y="169" width="7" height="9"></rect>
          <rect x="335" y="174" width="8" height="10"></rect>
          <rect x="349" y="174" width="8" height="10"></rect>
        </g>
        <g>
          <polygon points="234,226 248,226 273,78 266,78" fill="#DC4F3C"></polygon>
          <polygon points="305,226 291,226 266,78 273,78" fill="#DC4F3C"></polygon>
          <g stroke="#DC4F3C" stroke-width="2.5" opacity="0.85">
            <path d="M245 208 L294 208 M247 196 L277 144 M292 196 L262 144 M254 153 L285 153 M255 144 L275 109 M284 144 L264 109 M261 113 L278 113"></path>
          </g>
          <polygon points="242,160 297,160 293,174 247,174" fill="#DC4F3C"></polygon>
          <rect x="247" y="163" width="45" height="5" fill="#FBF1DE"></rect>
          <polygon points="256,107 283,107 281,118 258,118" fill="#DC4F3C"></polygon>
          <rect x="266" y="42" width="7" height="38" fill="#DC4F3C"></rect>
          <rect x="266" y="53" width="7" height="6" fill="#FBF1DE"></rect>
          <rect x="266" y="66" width="7" height="6" fill="#FBF1DE"></rect>
          <circle cx="269.5" cy="37" r="5" fill="#FFE79C"></circle>
        </g>
        <rect y="226" width="390" height="24" fill="#B84E5C"></rect>
        <g stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" fill="none" opacity="0.5">
          <path d="M106 238 q10 -9 20 0 q10 9 20 0"></path>
          <path d="M172 243 q10 -9 20 0 q10 9 20 0"></path>
          <path d="M314 238 q10 -9 20 0 q10 9 20 0"></path>
        </g>
      </svg>
    </sc-if>

    <div style="position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(46,42,36,0.28) 0%, rgba(46,42,36,0) 34%, rgba(46,42,36,0) 58%, rgba(46,42,36,0.42) 100%); pointer-events: none;"></div>

    <div style="position: absolute; top: 20px; left: 22px; right: 22px; display: flex; align-items: center; justify-content: space-between; gap: 12px;">
      <span style="font-size: 12px; font-weight: 600; letter-spacing: 0.18em; text-transform: uppercase; color: #FFFDF9;">Three Skies</span>
      <span style="font-size: 11px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: #FFFDF9; background: rgba(46,42,36,0.34); padding: 6px 12px; border-radius: 999px;">{{ c.tz }}</span>
    </div>

    <div style="position: absolute; left: 22px; bottom: 40px; display: flex; flex-direction: column; gap: 3px;">
      <h1 style="margin: 0; font-size: 36px; font-weight: 800; letter-spacing: -0.035em; line-height: 1; color: #FFFDF9;">{{ c.name }}</h1>
      <p style="margin: 0; font-family: 'Newsreader', Georgia, serif; font-style: italic; font-size: 15px; color: rgba(255,253,249,0.86);">{{ c.region }}</p>
    </div>
  </div>

  <!-- ===== BODY ===== -->
  <div style="flex: 1 1 auto; min-height: 0; margin-top: -22px; background: #FAF5EC; border-radius: 24px 24px 0 0; padding: 20px 22px 24px; display: flex; flex-direction: column; gap: 15px;">

    <div style="display: flex; gap: 8px;">
      <sc-for list="{{ tabs }}" as="tab" hint-placeholder-count="3">
        <button onClick="{{ tab.pick }}" style="flex: 1 1 0; min-width: 0; height: 46px; font-family: inherit; font-size: 14px; font-weight: 600; letter-spacing: -0.01em; border-radius: 999px; border: 1px solid; cursor: pointer; transition: all 140ms ease; {{ tab.style }}">{{ tab.label }}</button>
      </sc-for>
    </div>

    <div style="display: flex; gap: 4px; padding: 4px; background: #F1E9DB; border: 1px solid #E2D8C7; border-radius: 999px;">
      <button onClick="{{ pickSat }}" style="flex: 1 1 0; height: 44px; font-family: inherit; font-size: 14px; font-weight: 600; letter-spacing: -0.01em; border-radius: 999px; border: 1px solid transparent; cursor: pointer; transition: all 140ms ease; {{ satStyle }}">Saturday 22</button>
      <button onClick="{{ pickSun }}" style="flex: 1 1 0; height: 44px; font-family: inherit; font-size: 14px; font-weight: 600; letter-spacing: -0.01em; border-radius: 999px; border: 1px solid transparent; cursor: pointer; transition: all 140ms ease; {{ sunStyle }}">Sunday 23</button>
    </div>

    <div style="display: flex; align-items: center; justify-content: space-between; gap: 14px;">
      <div style="display: flex; flex-direction: column; gap: 4px;">
        <div style="display: flex; align-items: baseline; color: {{ c.accent }};">
          <span style="font-size: 66px; font-weight: 800; letter-spacing: -0.05em; line-height: 0.84;">{{ c.hi }}</span>
          <span style="font-size: 29px; font-weight: 600; letter-spacing: -0.02em;">{{ deg }}</span>
        </div>
        <span style="font-size: 12px; font-weight: 600; letter-spacing: 0.11em; text-transform: uppercase; color: #9A8F80;">High &middot; low {{ c.lo }}{{ deg }}</span>
      </div>
      <div style="color: {{ c.accent }}; flex: none;">
        <sc-if value="{{ c.iconFog }}" hint-placeholder-val="{{ true }}">
          <svg width="58" height="58" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="16.5" cy="7" r="3.2"></circle>
            <path d="M16.5 1.6v1.4M16.5 11v1.4M12.7 3.2l1 1M20.3 10.8l-1-1M11.1 7h1.4M20.5 7h1.4M12.7 10.8l1-1M20.3 3.2l-1 1"></path>
            <path d="M2.5 14.5h13M4.5 18h15M2.5 21.5h11"></path>
          </svg>
        </sc-if>
        <sc-if value="{{ c.iconSun }}" hint-placeholder-val="{{ false }}">
          <svg width="58" height="58" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="4.6"></circle>
            <path d="M12 1.8v3M12 19.2v3M4.4 4.4l2.1 2.1M17.5 17.5l2.1 2.1M1.8 12h3M19.2 12h3M4.4 19.6l2.1-2.1M17.5 6.5l2.1-2.1"></path>
          </svg>
        </sc-if>
        <sc-if value="{{ c.iconRain }}" hint-placeholder-val="{{ false }}">
          <svg width="58" height="58" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6.6 15.4a4.1 4.1 0 0 1 .5-8.2 5.6 5.6 0 0 1 10.7 1.5 3.6 3.6 0 0 1-.6 6.7"></path>
            <path d="M8.4 18.2l-1.3 3M13 18.2l-1.3 3M17.6 18.2l-1.3 3"></path>
          </svg>
        </sc-if>
        <sc-if value="{{ c.iconPartly }}" hint-placeholder-val="{{ false }}">
          <svg width="58" height="58" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="8.4" cy="8" r="3.3"></circle>
            <path d="M8.4 2.3v1.5M2.7 8h1.5M4.4 4l1.1 1.1M12.4 4l-1.1 1.1M4.4 12l1.1-1.1"></path>
            <path d="M10.6 19.4a3.9 3.9 0 0 1 .5-7.8 5.3 5.3 0 0 1 10.1 1.4 3.4 3.4 0 0 1-.6 6.4Z"></path>
          </svg>
        </sc-if>
        <sc-if value="{{ c.iconStorm }}" hint-placeholder-val="{{ false }}">
          <svg width="58" height="58" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6.6 15.4a4.1 4.1 0 0 1 .5-8.2 5.6 5.6 0 0 1 10.7 1.5 3.6 3.6 0 0 1-.6 6.7"></path>
            <path d="M13.4 12.6l-3.2 5.1h3.6l-2.4 4.3"></path>
          </svg>
        </sc-if>
        <sc-if value="{{ c.iconHot }}" hint-placeholder-val="{{ false }}">
          <svg width="58" height="58" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="9.6" r="4.2"></circle>
            <path d="M12 0.9v2.6M12 15.7v2.6M5.2 3.5l1.9 1.9M16.9 13.9l1.9 1.9M1.3 9.6h2.6M20.1 9.6h2.6M5.2 15.8l1.9-1.9M16.9 5.4l1.9-1.9"></path>
            <path d="M4 21q2.6-2.4 5.2 0t5.2 0 5.2 0"></path>
          </svg>
        </sc-if>
      </div>
    </div>

    <p style="margin: 0; font-family: 'Newsreader', Georgia, serif; font-size: 18px; line-height: 1.4; color: #554C43; text-wrap: pretty; min-height: 50px;">{{ c.blurb }}</p>

    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; padding: 14px 0; border-top: 1px solid #EFE7DA; border-bottom: 1px solid #EFE7DA;">
      <div style="display: flex; flex-direction: column; gap: 5px;">
        <span style="font-size: 10px; font-weight: 600; letter-spacing: 0.13em; text-transform: uppercase; color: #A09586;">Rain</span>
        <span style="font-size: 18px; font-weight: 600; letter-spacing: -0.01em; color: #2E2A24;">{{ c.rain }}</span>
      </div>
      <div style="display: flex; flex-direction: column; gap: 5px;">
        <span style="font-size: 10px; font-weight: 600; letter-spacing: 0.13em; text-transform: uppercase; color: #A09586;">Wind</span>
        <span style="font-size: 18px; font-weight: 600; letter-spacing: -0.01em; color: #2E2A24;">{{ c.wind }}</span>
      </div>
      <div style="display: flex; flex-direction: column; gap: 5px;">
        <span style="font-size: 10px; font-weight: 600; letter-spacing: 0.13em; text-transform: uppercase; color: #A09586;">Humidity</span>
        <span style="font-size: 18px; font-weight: 600; letter-spacing: -0.01em; color: #2E2A24;">{{ c.hum }}</span>
      </div>
    </div>

    <div style="display: flex; justify-content: space-between; align-items: flex-end; gap: 6px;">
      <sc-for list="{{ c.hours }}" as="h" hint-placeholder-count="6">
        <div style="display: flex; flex-direction: column; align-items: center; gap: 7px; flex: 1 1 0;">
          <span style="font-size: 14px; font-weight: 600; letter-spacing: -0.01em; color: #554C43;">{{ h.t }}</span>
          <div style="height: 58px; display: flex; align-items: flex-end;">
            <div style="width: 12px; height: {{ h.hpx }}px; border-radius: 999px; background: {{ h.bg }};"></div>
          </div>
          <span style="font-size: 11px; font-weight: 600; letter-spacing: 0.05em; color: #A09586;">{{ h.label }}</span>
        </div>
      </sc-for>
    </div>

    <div onClick="{{ flipDay }}" style="display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 60px; padding: 14px 18px; background: #F3ECDF; border-radius: 16px; cursor: pointer;">
      <div style="display: flex; flex-direction: column; gap: 3px; min-width: 0;">
        <span style="font-size: 10px; font-weight: 600; letter-spacing: 0.13em; text-transform: uppercase; color: #A09586;">{{ otherLabel }}</span>
        <span style="font-family: 'Newsreader', Georgia, serif; font-size: 16px; color: #554C43; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{ c.otherShort }}</span>
      </div>
      <div style="display: flex; align-items: center; gap: 10px; flex: none;">
        <span style="font-size: 20px; font-weight: 600; letter-spacing: -0.02em; color: #2E2A24;">{{ c.otherHi }}{{ deg }}</span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{ c.accent }}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"></path></svg>
      </div>
    </div>

  </div>
</div>
</x-dc>

<script data-dc-script data-props='{
  "units": {"editor": "enum", "options": ["Celsius", "Fahrenheit"], "default": "Celsius", "section": "Display"},
  "$preview": {"width": 390, "height": 844}
}'>
var CITIES = [
  {
    key: "sf", label: "SF", name: "San Francisco", region: "California, USA", tz: "GMT−7",
    accent: "#BF6134", tint: "#EBC6B1", icons: ["iconFog", "iconSun"],
    days: [
      { hi: 18, lo: 12, blurb: "Fog until noon, then it burns off into wide open sun.", short: "Fog, then sun",
        rain: "0%", wind: "18 km/h", hum: "78%",

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { city: 0, day: 0 };
  }

  isF() {
    return (this.props.units || "Celsius") === "Fahrenheit";
  }

  t(c) {
    return this.isF() ? Math.round(c * 9 / 5 + 32) : c;
  }

  renderVals() {
    var self = this;
    var day = this.state.day;
    var idx = this.state.city;
    var city = CITIES[idx];
    var d = city.days[day];
    var o = city.days[1 - day];

    var temps = d.hours.map(function (h) { return h[1]; });
    var lo = Math.min.apply(null, temps);
    var hi = Math.max.apply(null, temps);
    var span = Math.max(1, hi - lo);

    var c = {
      name: city.name,
      region: city.region,
      tz: city.tz,
      accent: city.accent,
      hi: this.t(d.hi),
      lo: this.t(d.lo),
      blurb: d.blurb,
      rain: d.rain,
      wind: d.wind,
      hum: d.hum,
      hours: d.hours.map(function (h) {
        return {
          label: h[0],
          t: self.t(h[1]),
          hpx: Math.round(14 + ((h[1] - lo) / span) * 42),
          bg: h[1] === hi ? city.accent : city.tint
        };
      }),
      otherHi: this.t(o.hi),
      otherShort: o.short,
      iconFog: false, iconSun: false, iconRain: false,
      iconPartly: false, iconStorm: false, iconHot: false
    };
    c[city.icons[day]] = true;

    var on = "background: #2E2A24; color: #FBF7F1; border-color: #2E2A24;";
    var off = "background: transparent; color: #7C7166; border-color: transparent;";

    return {
      c: c,
      deg: this.isF() ? "°F" : "°C",
      isSF: idx === 0,
      isLDN: idx === 1,
      isTKY: idx === 2,
      satStyle: day === 0 ? on : off,
      sunStyle: day === 1 ? on : off,
      otherLabel: day === 0 ? "Sunday 23" : "Saturday 22",
      pickSat: function () { self.setState({ day: 0 }); },
      pickSun: function () { self.setState({ day: 1 }); },
      flipDay: function () { self.setState({ day: 1 - self.state.day }); },
      tabs: CITIES.map(function (ct, i) {
        return {
          label: ct.label,
          style: i === idx
            ? "background: " + ct.accent + "; color: #FFFDF9; border-color: " + ct.accent + ";"
            : "background: #FFFDF9; color: #7C7166; border-color: #E7DFD3;",
          pick: function () { self.setState({ city: i }); }
        };
      })
    };
  }
}
</script>
