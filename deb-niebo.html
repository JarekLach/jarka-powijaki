<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Niebo nad Dębiną</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    background: radial-gradient(ellipse at top, #131a33 0%, #0b0e1a 60%, #05060c 100%);
    color: #e8ecf7;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: 24px 16px 60px;
  }

  header {
    text-align: center;
    margin-bottom: 28px;
  }

  header h1 {
    font-size: 1.8rem;
    letter-spacing: 0.02em;
  }

  header p {
    color: #8a93b8;
    margin-top: 6px;
    font-size: 0.9rem;
  }

  .cards {
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
    max-width: 900px;
    margin: 0 auto;
  }

  .card {
    flex: 1 1 320px;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 16px;
    padding: 22px;
  }

  .card h2 {
    font-size: 1rem;
    color: #a7b0d6;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 16px;
  }

  /* --- panel Księżyca --- */
  .moon-emoji {
    font-size: 4.5rem;
    text-align: center;
    margin-bottom: 8px;
  }

  .moon-name {
    text-align: center;
    font-size: 1.3rem;
    font-weight: 600;
    margin-bottom: 4px;
  }

  .moon-illum {
    text-align: center;
    color: #8a93b8;
    margin-bottom: 18px;
  }

  .moon-dates {
    display: flex;
    justify-content: space-between;
    font-size: 0.85rem;
    color: #c2c8e6;
    border-top: 1px solid rgba(255, 255, 255, 0.08);
    padding-top: 14px;
  }

  .moon-dates div { text-align: center; flex: 1; }
  .moon-dates b { display: block; font-size: 1.1rem; color: #fff; }

  /* --- panel Nieba --- */
  .sky-current {
    text-align: center;
    margin-bottom: 18px;
  }

  .sky-current .big {
    font-size: 2.6rem;
    font-weight: 700;
  }

  .sky-current .label {
    color: #8a93b8;
    font-size: 0.85rem;
  }

  .hours {
    display: flex;
    gap: 4px;
    align-items: flex-end;
    height: 90px;
    border-top: 1px solid rgba(255, 255, 255, 0.08);
    padding-top: 10px;
  }

  .hour-bar {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    gap: 4px;
    height: 100%;
  }

  .hour-bar .bar {
    width: 100%;
    max-width: 18px;
    background: #5b6bd6;
    border-radius: 4px 4px 0 0;
  }

  .hour-bar .t {
    font-size: 0.65rem;
    color: #8a93b8;
  }

  .rain-drop {
    font-size: 0.7rem;
    line-height: 1;
  }

  .rain-now {
    text-align: center;
    color: #8a93b8;
    font-size: 0.85rem;
    margin-top: 6px;
  }

  .refresh-btn {
    display: block;
    margin: 14px auto 0;
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.15);
    color: #e8ecf7;
    padding: 6px 14px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 0.85rem;
  }

  .refresh-btn:hover { background: rgba(255, 255, 255, 0.14); }

  /* --- werdykt --- */
  .verdict {
    max-width: 900px;
    margin: 20px auto 0;
    text-align: center;
    padding: 18px;
    border-radius: 16px;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(255, 255, 255, 0.08);
    font-size: 1.05rem;
  }

  .verdict .note {
    display: block;
    color: #8a93b8;
    font-size: 0.85rem;
    margin-top: 6px;
  }

  footer {
    text-align: center;
    color: #565e80;
    font-size: 0.75rem;
    margin-top: 24px;
  }
</style>
</head>
<body>

  <header>
    <h1>🌙 Niebo nad Dębiną</h1>
    <p>54.6366°N, 17.01451°E</p>
  </header>

  <div class="cards">
    <div class="card">
      <h2>Faza Księżyca</h2>
      <div class="moon-emoji" id="moon-emoji">🌑</div>
      <div class="moon-name" id="moon-name">—</div>
      <div class="moon-illum" id="moon-illum">—</div>
      <div class="moon-dates">
        <div><b id="days-to-new">—</b>dni do nowiu</div>
        <div><b id="days-to-full">—</b>dni do pełni</div>
      </div>
    </div>

    <div class="card">
      <h2>Niebo</h2>
      <div class="sky-current">
        <div class="big" id="cloud-now">—</div>
        <div class="label">zachmurzenie teraz</div>
        <div class="rain-now" id="rain-now">—</div>
      </div>
      <div class="hours" id="hours-strip"></div>
      <button class="refresh-btn" id="refresh-btn">↻ Odśwież pogodę</button>
    </div>

    <div class="card">
      <h2>Wschód / zachód Księżyca</h2>
      <div class="moon-dates">
        <div><b id="moon-rise">—</b>wschód</div>
        <div><b id="moon-set">—</b>zachód</div>
      </div>
    </div>
  </div>

  <div class="verdict" id="verdict">
    Ładowanie danych pogodowych…
  </div>

  <footer>dane pogodowe: open-meteo.com</footer>

  <script>
    // Współrzędne domu w Dębinie
    const LAT = 54.6366;
    const LON = 17.01451;

    // ═══════════════════════════════════════════════
    //  FAZA KSIĘŻYCA — czysta matematyka, bez API
    // ═══════════════════════════════════════════════

    // Długość cyklu księżycowego (nów → nów) w dniach
    const SYNODIC_MONTH = 29.530588853;

    // Znany moment nowiu, od którego liczymy (6 stycznia 2000, 18:14 UTC)
    const KNOWN_NEW_MOON = Date.UTC(2000, 0, 6, 18, 14, 0);

    // Nazwy i emoji dla 8 faz księżyca, posortowane wg pozycji w cyklu (0 = nów, 1 = powrót do nowiu)
    const MOON_PHASES = [
      { upTo: 0.0625, name: "Nów",                emoji: "🌑" },
      { upTo: 0.1875, name: "Sierp przybywający",  emoji: "🌒" },
      { upTo: 0.3125, name: "Pierwsza kwadra",     emoji: "🌓" },
      { upTo: 0.4375, name: "Garb przybywający",   emoji: "🌔" },
      { upTo: 0.5625, name: "Pełnia",              emoji: "🌕" },
      { upTo: 0.6875, name: "Garb ubywający",      emoji: "🌖" },
      { upTo: 0.8125, name: "Ostatnia kwadra",     emoji: "🌗" },
      { upTo: 0.9375, name: "Sierp ubywający",     emoji: "🌘" },
      { upTo: 1.01,   name: "Nów",                 emoji: "🌑" },
    ];

    function getMoonInfo(date) {
      const daysSinceNewMoon = (date.getTime() - KNOWN_NEW_MOON) / 86400000;

      // pozycja w bieżącym cyklu, w dniach (0 do SYNODIC_MONTH)
      let cyclePos = daysSinceNewMoon % SYNODIC_MONTH;
      if (cyclePos < 0) cyclePos += SYNODIC_MONTH;

      // ta sama pozycja, ale jako ułamek 0..1
      const fraction = cyclePos / SYNODIC_MONTH;

      const phase = MOON_PHASES.find(p => fraction <= p.upTo);

      // % oświetlenia tarczy (0% w nowiu, 100% w pełni)
      const illumination = Math.round((1 - Math.cos(2 * Math.PI * fraction)) / 2 * 100);

      const daysToNewMoon = Math.round(SYNODIC_MONTH - cyclePos);
      const daysToFullMoon = Math.round(
        cyclePos < SYNODIC_MONTH / 2
          ? SYNODIC_MONTH / 2 - cyclePos
          : SYNODIC_MONTH * 1.5 - cyclePos
      );

      return { name: phase.name, emoji: phase.emoji, illumination, daysToNewMoon, daysToFullMoon };
    }

    function renderMoon() {
      const info = getMoonInfo(new Date());
      document.getElementById("moon-emoji").textContent = info.emoji;
      document.getElementById("moon-name").textContent = info.name;
      document.getElementById("moon-illum").textContent = `oświetlenie: ${info.illumination}%`;
      document.getElementById("days-to-new").textContent = info.daysToNewMoon;
      document.getElementById("days-to-full").textContent = info.daysToFullMoon;
      return info;
    }

    // ═══════════════════════════════════════════════
    //  ZACHMURZENIE — Open-Meteo (darmowe, bez klucza)
    // ═══════════════════════════════════════════════

    async function fetchSky() {
      const url = `https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}` +
                  `&current=cloud_cover,precipitation` +
                  `&hourly=cloud_cover,precipitation_probability` +
                  `&timezone=auto&forecast_days=2`;
      const res = await fetch(url);
      if (!res.ok) throw new Error("Błąd pobierania pogody: " + res.status);
      return res.json();
    }

    function renderSky(data) {
      const cloudNow = data.current.cloud_cover;
      const rainNow = data.current.precipitation;
      document.getElementById("cloud-now").textContent = cloudNow + "%";
      document.getElementById("rain-now").textContent =
        rainNow > 0 ? `pada: ${rainNow} mm/h` : "brak opadów teraz";

      // znajdź w danych godzinowych indeks najbliższy "teraz"
      const now = new Date();
      const times = data.hourly.time.map(t => new Date(t));
      let startIdx = times.findIndex(t => t >= now);
      if (startIdx === -1) startIdx = 0;

      const nextClouds = [];
      const nextRainChances = [];
      const strip = document.getElementById("hours-strip");
      strip.innerHTML = "";
      for (let i = startIdx; i < startIdx + 12 && i < times.length; i++) {
        const cloud = data.hourly.cloud_cover[i];
        const rainChance = data.hourly.precipitation_probability[i];
        nextClouds.push(cloud);
        nextRainChances.push(rainChance);

        const bar = document.createElement("div");
        bar.className = "hour-bar";
        bar.innerHTML = `
          <div class="rain-drop" style="opacity:${rainChance / 100}">💧</div>
          <div class="bar" style="height:${Math.max(cloud, 3)}%; background:${cloud > 60 ? "#8a93b8" : "#5b6bd6"}"></div>
          <div class="t">${times[i].getHours()}</div>
        `;
        strip.appendChild(bar);
      }

      const avgNextHours = nextClouds.reduce((a, b) => a + b, 0) / nextClouds.length;
      const avgRainChance = nextRainChances.reduce((a, b) => a + b, 0) / nextRainChances.length;
      return { cloudNow, avgNextHours, avgRainChance };
    }

    // ═══════════════════════════════════════════════
    //  WSCHÓD / ZACHÓD KSIĘŻYCA — pozycja Księżyca na niebie,
    //  liczona z wzorów astronomicznych (algorytm z biblioteki SunCalc,
    //  oparty na "Astronomical Algorithms" J. Meeusa)
    // ═══════════════════════════════════════════════

    const RAD = Math.PI / 180;
    const DAY_MS = 1000 * 60 * 60 * 24;
    const J1970 = 2440588;
    const J2000 = 2451545;
    const EARTH_OBLIQUITY = RAD * 23.4397; // nachylenie osi Ziemi

    function toDays(date) {
      return date.valueOf() / DAY_MS - 0.5 + J1970 - J2000;
    }

    function rightAscension(l, b) {
      return Math.atan2(Math.sin(l) * Math.cos(EARTH_OBLIQUITY) - Math.tan(b) * Math.sin(EARTH_OBLIQUITY), Math.cos(l));
    }
    function declination(l, b) {
      return Math.asin(Math.sin(b) * Math.cos(EARTH_OBLIQUITY) + Math.cos(b) * Math.sin(EARTH_OBLIQUITY) * Math.sin(l));
    }
    function altitude(H, phi, dec) {
      return Math.asin(Math.sin(phi) * Math.sin(dec) + Math.cos(phi) * Math.cos(dec) * Math.cos(H));
    }
    function siderealTime(d, lw) {
      return RAD * (280.16 + 360.9856235 * d) - lw;
    }
    function astroRefraction(h) {
      if (h < 0) h = 0;
      return 0.0002967 / Math.tan(h + 0.00312536 / (h + 0.08901179));
    }

    function moonEquatorialCoords(d) {
      const L = RAD * (218.316 + 13.176396 * d); // długość ekliptyczna
      const M = RAD * (134.963 + 13.064993 * d); // anomalia średnia
      const F = RAD * (93.272 + 13.229350 * d);  // odległość średnia

      const l = L + RAD * 6.289 * Math.sin(M);
      const b = RAD * 5.128 * Math.sin(F);

      return { ra: rightAscension(l, b), dec: declination(l, b) };
    }

    function getMoonAltitude(date, lat, lon) {
      const lw = RAD * -lon;
      const phi = RAD * lat;
      const d = toDays(date);
      const c = moonEquatorialCoords(d);
      const H = siderealTime(d, lw) - c.ra;
      let h = altitude(H, phi, c.dec);
      h += astroRefraction(h);
      return h;
    }

    function hoursLater(date, h) {
      return new Date(date.valueOf() + h * DAY_MS / 24);
    }

    // szuka momentu w ciągu doby, kiedy Księżyc przecina linię horyzontu
    function getMoonTimes(date, lat, lon) {
      const t = new Date(date);
      t.setHours(0, 0, 0, 0); // lokalna północ

      const parallaxCorrection = 0.133 * RAD;
      let h0 = getMoonAltitude(t, lat, lon) - parallaxCorrection;
      let rise, set, ye;

      for (let i = 1; i <= 24; i += 2) {
        const h1 = getMoonAltitude(hoursLater(t, i), lat, lon) - parallaxCorrection;
        const h2 = getMoonAltitude(hoursLater(t, i + 1), lat, lon) - parallaxCorrection;

        const a = (h0 + h2) / 2 - h1;
        const b = (h2 - h0) / 2;
        const xe = -b / (2 * a);
        ye = (a * xe + b) * xe + h1;
        const d = b * b - 4 * a * h1;
        let roots = 0, x1, x2;

        if (d >= 0) {
          const dx = Math.sqrt(d) / (Math.abs(a) * 2);
          x1 = xe - dx;
          x2 = xe + dx;
          if (Math.abs(x1) <= 1) roots++;
          if (Math.abs(x2) <= 1) roots++;
          if (x1 < -1) x1 = x2;
        }

        if (roots === 1) {
          if (h0 < 0) rise = i + x1; else set = i + x1;
        } else if (roots === 2) {
          rise = i + (ye < 0 ? x2 : x1);
          set = i + (ye < 0 ? x1 : x2);
        }

        if (rise !== undefined && set !== undefined) break;
        h0 = h2;
      }

      return {
        rise: rise !== undefined ? hoursLater(t, rise) : null,
        set: set !== undefined ? hoursLater(t, set) : null,
      };
    }

    function formatHM(date) {
      const h = String(date.getHours()).padStart(2, "0");
      const m = String(date.getMinutes()).padStart(2, "0");
      return `${h}:${m}`;
    }

    function renderMoonTimes() {
      // brak wschodu lub zachodu danego dnia zdarza się naprawdę —
      // doba księżycowa trwa ok. 24h50min, więc raz na jakiś czas
      // jedno z tych zdarzeń "wypada" poza kalendarzowy dzień
      const times = getMoonTimes(new Date(), LAT, LON);
      document.getElementById("moon-rise").textContent = times.rise ? formatHM(times.rise) : "brak dziś";
      document.getElementById("moon-set").textContent = times.set ? formatHM(times.set) : "brak dziś";
    }

    // ═══════════════════════════════════════════════
    //  WERDYKT — łączymy fazę księżyca i zachmurzenie
    // ═══════════════════════════════════════════════

    function renderVerdict(moonInfo, skyInfo) {
      const el = document.getElementById("verdict");
      const { cloudNow, avgRainChance } = skyInfo;
      const { illumination } = moonInfo;

      let text, note;
      if (avgRainChance >= 50) {
        text = "🌧️ Szykuje się deszcz";
        note = `Szansa na opady w najbliższych godzinach: ${Math.round(avgRainChance)}%.`;
      } else if (cloudNow <= 25 && illumination <= 40) {
        text = "🔭 Świetna noc na obserwacje nieba!";
        note = "Mało chmur, księżyc nie przyćmiewa gwiazd.";
      } else if (cloudNow <= 50) {
        text = "🌥️ Widoczność w porządku";
        note = illumination > 60
          ? "Umiarkowane chmury, ale jasny księżyc przyćmi słabsze gwiazdy."
          : "Umiarkowane zachmurzenie, momentami może się przejaśnić.";
      } else {
        text = "☁️ Słaba widoczność";
        note = "Dużo chmur — raczej nie zobaczysz wiele.";
      }

      el.innerHTML = `${text}<span class="note">${note}</span>`;
    }

    // ═══════════════════════════════════════════════
    //  START
    // ═══════════════════════════════════════════════

    async function init() {
      const moonInfo = renderMoon();
      renderMoonTimes();
      try {
        const data = await fetchSky();
        const skyInfo = renderSky(data);
        renderVerdict(moonInfo, skyInfo);
      } catch (err) {
        document.getElementById("verdict").textContent = "Nie udało się pobrać danych pogodowych 😕";
        console.error(err);
      }
    }

    document.getElementById("refresh-btn").addEventListener("click", init);

    init();
  </script>
</body>
</html>
